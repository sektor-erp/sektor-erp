  .scan { animation: scan 5s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes scan { from { transform: translateX(-420px);} to { transform: translateX(1280px);} }
  .dot { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity:1;} 50% { opacity:.25;} }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
</style>
