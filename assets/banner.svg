<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img">
<defs>
  <radialGradient id="glow" cx="12%" cy="0%" r="80%">
    <stop offset="0" stop-color="#2F6BFF" stop-opacity=".55"/>
    <stop offset=".45" stop-color="#0F2A8F" stop-opacity=".35"/>
    <stop offset="1" stop-color="#05070C" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="txt" x1="0" x2="1">
    <stop offset="0" stop-color="#7EA6FF"/><stop offset=".5" stop-color="#2F6BFF"/><stop offset="1" stop-color="#45C6FF"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" x2="1">
    <stop offset="0" stop-color="#2F6BFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#45C6FF"/>
    <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
  </pattern>

  <clipPath id="frame"><rect width="1280" height="320" rx="18"/></clipPath>
</defs>
<style>
  .up { opacity:0; animation: up .9s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes up { from { opacity:0; transform: translateY(14px);} to { opacity:1; transform:none;} }
  .glow { animation: breathe 7s ease-in-out infinite; transform-origin: 0 0; }
  @keyframes breathe { 0%,100% { opacity:.85; transform: scale(1);} 50% { opacity:1; transform: scale(1.08);} }
  .scan { animation: scan 5s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes scan { from { transform: translateX(-420px);} to { transform: translateX(1280px);} }
  .dot { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity:1;} 50% { opacity:.25;} }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
</style>
<g clip-path="url(#frame)">
  <rect width="1280" height="320" fill="#05070C"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect class="glow" width="1280" height="320" fill="url(#glow)"/>

  <g font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
    <text class="up" style="animation-delay:.1s" x="88" y="96" font-family="ui-monospace,'Cascadia Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#8A93A6" letter-spacing="3">VERIDIAN · ARGENTINA</text>
    <text class="up" style="animation-delay:.3s" x="86" y="168" font-size="64" font-weight="800" fill="#F3F5F9" letter-spacing="-1.5">Software de gestión</text>
    <text class="up" style="animation-delay:.55s" x="86" y="236" font-size="64" font-weight="800" fill="#5D6680" letter-spacing="-1.5">para <tspan fill="url(#txt)">industrias.</tspan></text>
  </g>
  <g transform="translate(1004 118)"><g class="up" style="animation-delay:1.1s">
    <rect width="190" height="100" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
    <image x="35" y="22" width="120" height="51" href="data:image/png;base64,"/>
    <text x="95" y="90" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8A93A6" letter-spacing="2">CREADORES DE SIG</text>
  </g></g>
  <g class="up" style="animation-delay:1.4s" font-family="ui-monospace,'Cascadia Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8A93A6" letter-spacing="2">
    <circle class="dot" cx="94" cy="276" r="4" fill="#2F6BFF"/>
    <text x="108" y="281">VERIDIAN-WARE.COM</text>
  </g>

  <rect class="scan" x="0" y="317" width="420" height="3" fill="url(#scan)"/>
</g>
</svg>
